name: FlowMLLab CI

on:
  push:
    paths:
      - "FlowMLLab/**"
      - "MIE690A_AI_in_Fluid_Mechanics/common/**"
      - "MIE690A_AI_in_Fluid_Mechanics/qa/**"
      - ".github/workflows/flowmllab-ci.yml"
  pull_request:
    paths:
      - "FlowMLLab/**"
      - "MIE690A_AI_in_Fluid_Mechanics/common/**"
      - "MIE690A_AI_in_Fluid_Mechanics/qa/**"
      - ".github/workflows/flowmllab-ci.yml"

jobs:
  package-and-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e './FlowMLLab[test]'
      - name: Unit tests
        run: pytest FlowMLLab/tests
      - name: CLI structural validation
        run: flowmllab --root . validate --structural-only
      - name: Rebuild retained continuum and DSMC figures
        run: |
          flowmllab --root . reproduce continuum
          flowmllab --root . reproduce dsmc
