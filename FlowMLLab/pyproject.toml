[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmllab"
version = "1.0.0"
description = "Reproducible CFD-to-scientific-machine-learning experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ehsan Roohi", email = "roohie@umass.edu"},
]
keywords = ["CFD", "DSMC", "scientific machine learning", "DeepONet", "validation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.10",
]

[project.optional-dependencies]
neural = ["tensorflow>=2.12"]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/Ehsan-Roohi/Machine_Learning/tree/main/FlowMLLab"
Documentation = "https://github.com/Ehsan-Roohi/Machine_Learning/tree/main/FlowMLLab/docs"
Issues = "https://github.com/Ehsan-Roohi/Machine_Learning/issues"

[project.scripts]
flowmllab = "flowmllab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
